name: Manual Release
run-name: manual release (${{ inputs.bump }})

# Manual clone of ./release.sh: version bump -> commit -> build -> sign -> tag.
#
# release.sh stays the working local copy and is not modified.
#
# Deliberate differences from ./release.sh:
#   * the commit identity comes from the actor who pressed Run instead of
#     .release_env;
#   * the build runs as native runner steps rather than
#     `docker compose run *_builder` / `plugin_signer` — same result:
#     dist/ and package-lock.json;
#   * instead of `git push --tags` we push one specific branch+tag
#     (--follow-tags), so unrelated local tags can never ride along;
#   * release.yml is triggered explicitly at the end: a tag pushed with the
#     repository's own GITHUB_TOKEN does not start another workflow.
#
# The commit shows up as "Unverified" (CI holds no private key of the actor),
# but the person who ran the workflow is recorded as its author.

'on':
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Which part of the version to raise
          (current value: current_version in .bumpversion.cfg)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# contents: the version commit and the tag push; actions: starting release.yml
permissions:
  contents: write
  actions: write

# Releases must not run in parallel: the second run waits for the first.
concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # usage of GRAFANA_API_KEY is deprecated
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and all tags: --follow-tags needs the ancestor and
          # `git diff-index --quiet HEAD` has to be honest, like in release.sh.
          fetch-depth: 0
          persist-credentials: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq dos2unix

      - name: Configure git as the person who pressed Run
        run: |
          # release.sh: git config core.eol lf / core.autocrlf input
          git config core.eol lf
          git config core.autocrlf input
          # release.sh reads GITHUB_LOGIN/GITHUB_EMAIL from .release_env;
          # here the same two values come from the actor who started this run.
          login="${GITHUB_ACTOR}"
          user_json="$(gh api "users/${login}")"
          name="$(jq -r '.name // empty' <<<"${user_json}")"
          email="$(jq -r '.email // empty' <<<"${user_json}")"
          if [[ -z "${email}" ]]; then
            # No public email: fall back to noreply so that GitHub still
            # links the commit to the account.
            id="$(jq -r '.id' <<<"${user_json}")"
            email="${id}+${login}@users.noreply.github.com"
          fi
          [[ -n "${name}" ]] || name="${login}"
          git config user.name "${name}"
          git config user.email "${email}"
          echo "Commit author: ${name} <${email}>"
          # Author is the actor, pusher is github-actions[bot]: the actor's
          # private PAT is not available in CI (see the header). gh sets up a
          # credential helper for GITHUB_TOKEN, so the token never ends up in
          # the remote URL.
          gh auth setup-git

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          # @grafana/sign-plugin 4.x needs Node >= 24.5; .nvmrc and the
          # builder image use 24 as well
          node-version: '24'
          cache: 'npm'

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install bump-my-version
        # release.sh calls bump2version, which no longer imports on
        # Python >= 3.12 (sre_constants was removed) and is unmaintained.
        # bump-my-version reads .bumpversion.cfg as is and produces the same
        # "Bump version: X -> Y" commit and the same annotated vX.Y.Z tag.
        run: |
          pipx install bump-my-version==1.8.1
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Bump version (commit + tag)
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # release.sh: bump2version --verbose $1
          bump-my-version bump --verbose "${BUMP}"
          new_version="$(sed -n 's/^current_version = //p' .bumpversion.cfg)"
          test -n "${new_version}"
          git rev-parse -q --verify "refs/tags/v${new_version}" >/dev/null \
            || { echo "::error::no tag v${new_version} after bump"; exit 1; }
          echo "new-version=${new_version}" >> "${GITHUB_OUTPUT}"
          summary="## Bump: **${BUMP}** -> v${new_version}"
          echo "${summary}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Sync package-lock.json
        # Inside frontend_builder, release.sh runs `npm install`, which is what
        # refreshes version in package-lock.json — the only build output that
        # reaches git (dist/ is gitignored): the same two-line diff as in the
        # historical prepare commits.
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install nodejs dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm run test:ci

      - name: Build backend
        # release.sh: docker compose run --rm backend_builder, i.e. `mage -v`
        # (Default = BuildAll from grafana-plugin-sdk-go) plus chmod.
        run: |
          go install github.com/magefile/mage@latest
          mage buildAll
          chmod +rx ./dist/altinity-clickhouse-plugin*

      - name: Normalize dist line endings
        # release.sh: sudo dos2unix ./dist/* (insurance for Windows releases).
        # A no-op on a Linux runner; dos2unix skips binaries, hence || true.
        run: dos2unix ./dist/* || true

      - name: Warn missing Grafana access policy token
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN == '' }}
        run: |
          docs="https://grafana.com/docs/grafana/latest/developers"
          docs="${docs}/plugins/sign-a-plugin/#generate-a-token"
          echo "Please generate a Grafana access policy token: ${docs}"
          echo "Without it the plugin will not be signed."

      - name: Sign plugin
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        # release.sh: docker compose run --rm plugin_signer (== npm run sign)
        run: npx --yes @grafana/sign-plugin@latest

      - name: Check package version matches the tag
        # Copy of the release.yml check: never push a tag the release
        # pipeline would reject anyway.
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          plugin_version="$(jq -r .info.version dist/plugin.json)"
          if [[ "v${plugin_version}" != "v${NEW_VERSION}" ]]; then
            echo "::error::plugin.json=${plugin_version} bump=${NEW_VERSION}"
            echo "::error::versions differ, not pushing the tag"
            exit 1
          fi

      - name: Commit build artifacts
        run: |
          git add .
          cfg="$(grep current_version .bumpversion.cfg)"
          # exactly the message release.sh uses
          msg="prepare to new release, ${cfg}"
          git diff-index --quiet HEAD || git commit -s -m "${msg}"

      - name: Push commit and tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
          head="$(git rev-parse --short HEAD)"
          summary="Pushed ${head} v${NEW_VERSION} to ${GITHUB_REF_NAME}"
          echo "${summary}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Trigger the Release workflow
        # The tag was pushed with the repository GITHUB_TOKEN, and events
        # created by it do not cascade, so start release.yml by hand.
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          tag="v${NEW_VERSION}"
          gh workflow run release.yml --ref "${tag}" -R "${repo}"
          run_id=""
          for _ in $(seq 1 12); do
            runs="$(gh run list -R "${repo}" --workflow release.yml \
                     --limit 10 --json databaseId,headBranch)"
            filt='[.[] | select(.headBranch==$t)][-1].databaseId'
            run_id="$(jq -r --arg t "${tag}" "${filt} // empty" <<<"${runs}")"
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          if [[ -n "${run_id}" ]]; then
            url="${GITHUB_SERVER_URL}/${repo}/actions/runs/${run_id}"
            echo "Release workflow: ${url}" >> "${GITHUB_STEP_SUMMARY}"
            echo "Started ${url}"
          else
            echo "::warning::release.yml is not queued yet, start it by hand:"
            echo "  gh workflow run release.yml --ref ${tag} -R ${repo}"
          fi
